services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    expose:
      - "8000"

    env_file:
      - ./backend/.env

    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: wsd_taskboard
      DB_USERNAME: wsd
      DB_PASSWORD: "09012004"

      CACHE_STORE: redis
      CACHE_DRIVER: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - frontend_net
      - backend_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wsd_taskboard
      POSTGRES_USER: wsd
      POSTGRES_PASSWORD: "09012004"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsd -d wsd_taskboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend_net

volumes:
  db_data:
  redis_data:

networks:
  frontend_net:
  backend_net: