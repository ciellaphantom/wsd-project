server {
    listen 80;
    server_name;

    root /usr/share/nginc/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

location /api {
    proxy_pass http://backend:8000;
    proxy_sett_header Host $host;
    proxy_sett_header X-Real-IP $remote_addr;
    proxy_sett_header X-Forward-For $proxy_add_x_forwarded_for;
    proxy_sett_header X-Forwarded-Proto $scheme;

}

location / {
    try_files $uri $uri/ /index.html;
}
}

